<!doctype html>
<html lang="pt-BR"><body style="margin:0;padding:24px 12px;background:#f5f8f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;">
    <table role="presentation" style="border-collapse:collapse;margin:0 0 16px 4px;"><tr>
      <td style="padding:0 10px 0 0;vertical-align:middle;"><img src="https://www.doclimpo.com/icon-192.png" width="32" height="32" alt="" style="display:block;border:0;border-radius:8px;"></td>
      <td style="vertical-align:middle;font-size:19px;font-weight:800;letter-spacing:-0.3px;color:#0b1210;">DocLimpo</td>
    </tr></table>
    <div style="background:#ffffff;border:1px solid #dde5e1;border-radius:18px;padding:28px;">
      <h1 style="margin:0 0 16px;font-size:23px;line-height:1.25;font-weight:800;color:#0b1210;">Confirme seu e-mail.</h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:#33403b;">Falta um passo para o DocLimpo começar a avisar você antes dos vencimentos. Confirme que este endereço é seu.</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2fd97f;color:#0b1210;text-decoration:none;padding:13px 24px;border-radius:999px;font-size:15px;font-weight:700;">Confirmar e-mail</a>
    </div>
    <p style="margin:16px 4px 0;font-size:12px;line-height:1.6;color:#63706b;">Você recebeu este e-mail porque criou uma conta no DocLimpo. Se não foi você, ignore esta mensagem.</p>
  </div>
</body></html>
